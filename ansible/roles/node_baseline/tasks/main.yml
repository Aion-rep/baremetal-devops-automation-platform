---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline operational packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

- name: Create DevOps automation working directory
  ansible.builtin.file:
    path: "{{ baseline_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
